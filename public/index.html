<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light"><style>:root{color-scheme:only light}</style>
<title>Mapa verejných zmlúv – zmluvy z Centrálneho registra zmlúv</title>
<meta name="description" content="Mapa verejných zmlúv: interaktívna mapa zmlúv z Centrálneho registra zmlúv. Kto zmluvy uzatvára, s kým a na akú sumu.">
<meta name="theme-color" content="#F3F5FA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<script src="/vendor/maplibre-gl.js"></script>
<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#16213E; --mut:#5D6680; --line:#DDE3EF; --soft:#E9EDF5;
  --o:#2747E6; --o-soft:#E6EBFF; --d:#D21F66; --d-soft:#FCE4EE; --gold:#F5C518;
  --acc:var(--o); --acc-soft:var(--o-soft);
  --panel:440px; --peek:344px;
  --f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 10px 30px -12px rgba(22,33,62,.35);
}
body.role-d{--acc:var(--d);--acc-soft:var(--d-soft)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
a{color:var(--acc);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums;font-stretch:85%}

/* ---------- mapa ---------- */
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font:12px var(--f)!important}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(var(--sh,var(--peek)) + 6px)}

/* ---------- plávajúce ovládanie na mape ---------- */
#top{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;height:52px;padding:0 14px 0 8px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);flex-shrink:0}
.brand svg{width:36px;height:36px}
.brand b{font-size:17px;font-weight:750;letter-spacing:-.01em;line-height:1.05;font-stretch:90%}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.role{display:flex;background:var(--card);border-radius:18px;padding:5px;box-shadow:var(--shadow);gap:4px;flex:1;max-width:420px}
.role button{flex:1;border:0;border-radius:13px;min-height:44px;padding:6px 10px;white-space:nowrap;background:transparent;font-weight:650;font-size:16px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s}
.role button i{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.5}
.role button[data-v=o].on{background:var(--o);color:#fff}
.role button[data-v=d].on{background:var(--d);color:#fff}
.role button.on i{background:#fff;opacity:1}
.fab{width:52px;height:52px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex-shrink:0}
.fab svg{width:24px;height:24px}
.fab:active,.chip:active,.role button:active{transform:scale(.97)}
#mapBtns{position:fixed;z-index:8;right:10px;bottom:calc(var(--sh,var(--peek)) + 12px);display:flex;flex-direction:column;gap:8px;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
body.sheet-full #mapBtns{opacity:0;pointer-events:none}
body.sheet-min .head .total,body.sheet-min .head .sub{visibility:hidden}
.maplibregl-ctrl-bottom-right{right:66px!important}
#mapBtns .fab{width:48px;height:48px;border-radius:14px}
.maplibregl-ctrl-group{border-radius:14px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{width:48px!important;height:48px!important}

/* ---------- štítok testovacej verzie ---------- */
#beta{position:fixed;z-index:9;border:0;margin:0;background:var(--gold);color:var(--ink);font:800 12px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px -4px rgba(22,33,62,.45);
  background-image:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(22,33,62,.09) 10px 20px)}
/* mobil: nálepka nalepená na hornom okraji spodného panela */
#beta{left:14px;bottom:calc(var(--sh,var(--peek)) - 9px);padding:7px 12px;border-radius:7px;transform:rotate(-4deg);transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
body.fs #beta{bottom:calc(env(safe-area-inset-bottom) + 14px)}

/* ---------- panel (mobil: spodný panel) ---------- */
#panel{position:fixed;z-index:7;left:0;right:0;bottom:0;height:var(--sh,var(--peek));background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -12px 40px -16px rgba(22,33,62,.4);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);transition:height .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
#panel.drag{transition:none}
.grab{display:flex;justify-content:center;padding:10px 0 4px;cursor:grab}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
.head{padding:2px 18px 10px;touch-action:none}
.scope{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;min-height:40px}
.scope .lbl{display:flex;align-items:center;gap:9px;min-width:0;font-weight:750;font-size:17px;color:var(--ink)}
.scope .lbl svg{flex-shrink:0;color:var(--mut)}
.scope .lbl.here svg{color:var(--ink);background:var(--gold);border-radius:50%;padding:3px;width:26px;height:26px}
.scope .lbl>span{min-width:0;line-height:1.15}
.scope .lbl small{display:block;font-weight:500;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope .back{display:flex;align-items:center;gap:6px;border:0;background:var(--ink);color:#fff;border-radius:12px;min-height:40px;padding:0 13px;font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.total .big{font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1;font-stretch:80%;color:var(--acc)}
.total .cnt{font-size:15px;color:var(--mut);text-align:right;line-height:1.2}
.total .cnt b{display:block;color:var(--ink);font-size:20px;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.sub .src{display:block;font-size:12.5px;margin-top:2px}
.live[hidden]{display:none}
.live{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px;color:var(--mut)}
.live b{color:var(--ink);font-weight:700}
.live .now{display:inline-flex;align-items:center;gap:6px;background:rgba(31,157,85,.1);color:#17703d;border-radius:999px;padding:3px 10px 3px 8px;font-weight:600}
.live .now b{color:#17703d}
.live .dot{width:8px;height:8px;border-radius:50%;background:#1f9d55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.45)}70%{box-shadow:0 0 0 7px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
body.sheet-min .head .live{visibility:hidden}
.how{border:0;background:none;padding:0;color:var(--acc);font:inherit;font-weight:650;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 6px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 15px;font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.ghost{border-style:dashed}
.sep{width:1.5px;background:var(--line);margin:6px 4px;flex-shrink:0}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1.5px solid var(--soft);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px 12px;font-weight:650;font-size:15px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
#body{flex:1;overflow:auto;padding:6px 18px 28px;overscroll-behavior:contain;touch-action:pan-y}

/* ---------- obsah ---------- */
.lead{color:var(--mut);font-size:14.5px;margin:10px 0 6px}
.row{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 0;border-bottom:1.5px solid var(--soft)}
.row .l1{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.row .t{font-weight:650;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .amt{font-weight:800;font-size:18px;white-space:nowrap;font-stretch:85%;font-variant-numeric:tabular-nums}
.row .who{font-size:14px;color:var(--mut);margin-top:4px;line-height:1.35}
.row .who b{font-weight:600;color:var(--ink)}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;font-size:13px;color:var(--mut)}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--ink)}
.tag.red{background:#FFE1E1;color:#9B1C1C}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag.twin{display:inline-flex;align-items:center;gap:5px;background:#FFF1CC;color:#6B4A00}
.tag.twin svg{width:13px;height:13px;flex-shrink:0}
.twinbox{display:flex;gap:10px;align-items:flex-start;background:#FFF8E6;border:1px solid #F3DDA0;border-radius:14px;padding:11px 13px;margin:2px 0 12px;font-size:14px;line-height:1.45;color:#4A3700}
.twinbox svg{width:20px;height:20px;flex-shrink:0;margin-top:1px;color:#B07A00}
.twinbox a{color:var(--acc);font-weight:650;white-space:nowrap}
.row.dead .amt{text-decoration:line-through;color:var(--mut)}
.det{display:none;margin-top:12px;background:var(--paper);border-radius:14px;padding:6px 14px 12px}
.row.open .det{display:block}
.det dl{margin:0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:0 12px;font-size:14px}
.det dt{color:var(--mut);padding:7px 0;border-bottom:1px solid var(--line)}
.det dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);word-break:break-word}
.files{margin-top:10px;display:grid;gap:6px}
.files a{display:flex;justify-content:space-between;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink);border:1.5px solid var(--line)}
.files a span{color:var(--mut);font-weight:500;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-top:12px}
.btn.sec{background:var(--soft);color:var(--ink)}
.report{display:block;text-align:center;margin-top:10px;font-size:14px;color:var(--mut)}
.place-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:8px}
.place-h h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-stretch:85%}
.place-h p{margin:4px 0 0;color:var(--mut);font-size:14px}
.x{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:14px 0 6px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:42px;font-weight:650;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(22,33,62,.12)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpis div{background:var(--paper);border-radius:14px;padding:10px 14px}
.kpis small{color:var(--mut);font-size:13px}
.kpis b{display:block;font-size:22px;font-weight:800;font-stretch:85%;letter-spacing:-.01em}
.note{background:#FFF6D6;border-radius:14px;padding:11px 14px;font-size:14px;margin:10px 0}
.filter{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc-soft);color:var(--acc);border-radius:12px;padding:8px 8px 8px 14px;font-weight:600;font-size:14px;margin:8px 0}
.filter button{border:0;background:var(--card);border-radius:9px;min-height:34px;padding:0 12px;font-weight:650;color:var(--ink)}
.rank{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1.5px solid var(--soft)}
.rank .bar{height:6px;border-radius:3px;background:var(--acc);margin-top:6px;opacity:.85}
.rank .n{flex:1;min-width:0}
.rank .n b{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .n small{color:var(--mut);font-size:13px}
.rank .amt{font-weight:800;font-stretch:85%;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);padding:24px 0;text-align:center}
#chart svg{width:100%;height:auto;display:block;margin-top:6px}
.about h3{font-size:22px;margin:14px 0 6px;font-weight:800;letter-spacing:-.01em}
.about p,.about li{font-size:15px}
.about ul{padding-left:18px}

/* ---------- vyhľadávanie ---------- */
#search{position:fixed;inset:0;z-index:20;background:rgba(22,33,62,.35);display:none}
#search.on{display:block}
#search .box{background:var(--card);margin:calc(env(safe-area-inset-top) + 10px) 10px 0;border-radius:20px;box-shadow:var(--shadow);max-width:640px;max-height:calc(100dvh - 30px);display:flex;flex-direction:column}
#search .in{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1.5px solid var(--soft)}
#search input{flex:1;border:0;outline:0;font-size:18px;min-height:46px;background:none}
#res{overflow:auto;padding:0 16px 10px}
#res .rank small{display:block}

@media (max-width:899px){
  .brand{padding:0 8px;width:52px;justify-content:center}
  .brand span{display:none}
  .role button{font-size:15px}
}
@media (max-width:430px){.role button i{display:none}.role button{padding:6px 6px;font-size:14.5px}}

/* ---------- celá obrazovka ---------- */
body.fs #panel,body.fs .brand,body.fs #btnSearch,body.fs #panelToggle{display:none!important}
body.fs{--peek:0px;--sh:0px!important}
body.fs #mapBtns{bottom:calc(env(safe-area-inset-bottom) + 40px)}
.only-fs{display:none}
body.fs .only-fs{display:block}
body.fs .no-fs{display:none}

#panelToggle{display:none;position:fixed;z-index:9;top:50%;left:var(--panel);transform:translateY(-50%);width:34px;height:72px;border:0;border-radius:0 14px 14px 0;background:var(--card);box-shadow:4px 0 14px -6px rgba(22,33,62,.35);place-items:center;transition:left .25s cubic-bezier(.2,.8,.2,1)}
#panelToggle svg{transition:transform .25s}
#panel .brandrow{display:none;align-items:center;justify-content:space-between;gap:10px;padding:20px 18px 6px}
#panel .brandrow .brand{box-shadow:none;padding:0;height:auto;width:auto}
#panel .brandrow .brand span{display:block}
#panel .brandrow .brand b{font-size:21px}
#panel .brandrow .fab{box-shadow:none;background:var(--soft);width:46px;height:46px}

/* ---------- počítač ---------- */
@media (min-width:900px){
  :root{--peek:0px}
  #map{left:var(--panel)}
  /* celý panel sa posúva ako jeden celok (aj dotykom), aby bol zoznam zmlúv dostupný aj na nízkej obrazovke */
  #panel{top:0;right:auto;width:var(--panel);height:auto!important;border-radius:0;box-shadow:1px 0 0 var(--line);padding-bottom:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  #body{flex:none;overflow:visible}
  #panel>*{flex-shrink:0}
  /* na mobile vrch panela slúži na ťahanie (touch-action:none); na počítači ho treba vedieť posúvať prstom */
  #panel,#panel .head,#panel .grab,#panel .brandrow{touch-action:pan-y}
  #panel .chips,#panel .tabs{touch-action:pan-x pan-y}
  #panel .tabs{position:sticky;top:0;background:var(--card);z-index:2}
  #panelToggle{display:grid}
  #beta{left:auto;bottom:auto;top:44px;right:-48px;width:210px;padding:9px 0;border-radius:0;transform:rotate(45deg);text-align:center;font-size:12.5px}
  body.fs #beta{bottom:auto}
  #top{right:120px}
  body.panel-off #panel{transform:translateX(-100%)}
  body.panel-off #map{left:0}
  body.panel-off #top{left:64px}
  body.panel-off #panelToggle{left:0}
  body.panel-off #panelToggle svg{transform:rotate(180deg)}
  .grab{display:none}
  #panel .brandrow{display:flex}
  #top{left:calc(var(--panel) + 14px);right:14px;top:14px}
  #top .brand,#top #btnSearch{display:none}
  .chips{flex-wrap:wrap;overflow:visible}
  .sep{display:none}
  .tabs{padding:10px 8px 0}
  .tabs button{padding:10px 9px 12px}
  .role{max-width:400px}
  #mapBtns{bottom:30px!important;right:14px}
  .maplibregl-ctrl-bottom-right{right:66px!important}
  .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:0}
  .head{padding-top:4px}
  .total .big{font-size:46px}
  body.fs #map{left:0}
  body.fs #top{left:14px}
  #search .box{margin:14px auto 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Mapa zmlúv"></div>

<div id="top">
  <a class="brand no-fs" href="/" aria-label="Mapa verejných zmlúv">
    <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#16213E"/><circle cx="14" cy="15" r="6.5" fill="#2747E6"/><circle cx="22.5" cy="21.5" r="8" fill="#D21F66" opacity=".9"/><circle cx="14" cy="15" r="2.2" fill="#F5C518"/></svg>
    <span><b>Mapa verejných zmlúv</b><small>z Centrálneho registra zmlúv</small></span>
  </a>
  <div class="role" id="role" role="group" aria-label="Zobraziť">
    <button data-v="o" class="on"><i></i>Objednávatelia</button>
    <button data-v="d"><i></i>Dodávatelia</button>
  </div>
  <button class="fab no-fs" id="btnSearch" aria-label="Hľadať"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
</div>

<div id="mapBtns">
  <button class="fab" id="btnFs" aria-label="Celá obrazovka" title="Celá obrazovka">
    <svg class="no-fs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="only-fs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
  <button class="fab" id="btnHome" aria-label="Celé Slovensko" title="Celé Slovensko"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></button>
</div>

<button id="beta" title="Čo znamená testovacia verzia?">Testovacia verzia</button>
<button id="panelToggle" aria-label="Skryť panel" title="Skryť / zobraziť panel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<section id="panel" aria-label="Prehľad">
  <div class="brandrow">
    <a class="brand" href="/" aria-label="Mapa verejných zmlúv">
      <svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#16213E"/><circle cx="14" cy="15" r="6.5" fill="#2747E6"/><circle cx="22.5" cy="21.5" r="8" fill="#D21F66" opacity=".9"/><circle cx="14" cy="15" r="2.2" fill="#F5C518"/></svg>

<script>
'use strict';
const S = { role: 'o', per: '30', met: 's', tab: 'list', sort: 'amt', priv: false, pidx: null, meta: null, places: null, cols: null, place: null, filter: '', names: null, top: null, daily: null, shown: 40 };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = new Intl.NumberFormat('sk-SK', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });

const plural = (n, a, b, c) => n === 1 ? a : n >= 2 && n <= 4 ? b : c;
const STAV = { 1: 'rozpracovaná', 2: 'zverejnená', 3: 'doplnená', 4: 'zrušená', 5: 'stiahnutá' };
const TYP = { 1: 'zmluva / dodatok', 2: 'informácia o zmluve' };
const DRUH = { 0: 'zmluva', 1: 'zmluva', 2: 'dodatok' };
const ZDROJ = { 1: 'webové rozhranie', 2: 'XML import', 3: 'XML robot' };
const LABEL = {
  id: 'ID v CRZ', cislo: 'Číslo zmluvy', objednavatel: 'Objednávateľ', objednavatel_ico: 'IČO objednávateľa', objednavatel_adresa: 'Sídlo objednávateľa',
  dodavatel: 'Dodávateľ', dodavatel_ico: 'IČO dodávateľa', dodavatel_adresa: 'Sídlo dodávateľa', predmet: 'Predmet', popis: 'Popis', popis_predmetu: 'Popis predmetu',
  poznamka: 'Poznámka', poznamka_zmena: 'Poznámka k zmene', interna_poznamka: 'Interná poznámka CRZ', text_ucinnost: 'Poznámka k účinnosti', datum_podpisu: 'Podpísaná',
  datum_ucinnosti: 'Účinná od', platnost_do: 'Platná do', zverejnene: 'Zverejnená', zmenene: 'Posledná zmena', suma: 'Zmluvná suma', suma_spolu: 'Suma s dodatkami',
  stav: 'Stav', typ: 'Typ', druh: 'Druh', zdroj: 'Spôsob zverejnenia', rezort: 'ID rezortu', interne_id: 'Interné ID', referencia: 'Odkaz na hlavnú zmluvu',
  obstaravanie: 'Verejné obstarávanie', potvrdenie: 'Potvrdenie o zverejnení', potvrdenie_datum: 'Dátum potvrdenia', zmeny: 'Záznam zmien',
};
const COLOR = { o: '#2747E6', d: '#D21F66' };
// kontaktný e-mail doplní build (premenná CONTACT_EMAIL v GitHube); ak chýba, kontakt sa skryje
const CONTACT = (() => { const c = '__CONTACT_EMAIL__'; return c.includes('@') && !c.startsWith('__') ? c : ''; })();
const SFX = () => (S.priv ? '_p' : ''); // prípona stĺpcov pre filter „Len súkromný sektor“
const KRAJ = { Bratislava: 'Bratislavský', Trnava: 'Trnavský', Trencin: 'Trenčiansky', Nitra: 'Nitriansky', Zilina: 'Žilinský', 'Banska Bystrica': 'Banskobystrický', Presov: 'Prešovský', Kosice: 'Košický' };
const where = (P) => [P.okres ? 'okres ' + P.okres : '', P.kraj ? (KRAJ[P.kraj] || P.kraj) + ' kraj' : ''].filter(Boolean).join(', ');
const desktop = () => matchMedia('(min-width:900px)').matches;
let V = '';
const api = (f) => fetch('/api/' + f + (V ? '?v=' + encodeURIComponent(V) : '')).then((r) => { if (!r.ok) throw new Error(f + ': ' + r.status); return r.json(); });

// ---------- mapa ----------
const SK = [[16.83, 47.73], [22.57, 49.62]];
const map = new maplibregl.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/positron', bounds: SK, fitBoundsOptions: { padding: pad() },
  minZoom: 5, maxZoom: 17, maxBounds: [[14.5, 46.6], [24.8, 50.6]], attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false,
  customAttribution: 'Dáta: <a href="https://www.crz.gov.sk/">CRZ</a> (CC BY 4.0), <a href="https://www.geonames.org/">GeoNames</a>',
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
function pad() {
  if (document.body.classList.contains('fs')) return { top: 80, bottom: 30, left: 20, right: 20 };
  return desktop() ? { top: 90, bottom: 40, left: 40, right: 80 } : { top: 80, bottom: (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--peek')) || 344) + 20, left: 16, right: 16 };
}
const home = () => map.fitBounds(SK, { padding: pad(), duration: 700 });

function geojson() {
  const c = S.cols, iN = c.indexOf(`${S.role}${S.per}n${SFX()}`), iS = c.indexOf(`${S.role}${S.per}s${SFX()}`), iV = S.met === 's' ? iS : iN;
  const feats = [];
  for (const r of S.places) if (r[iN]) feats.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [r[5], r[4]] }, properties: { key: r[0], name: r[1], v: r[iV] } });
  return { type: 'FeatureCollection', features: feats };
}
function drawMap() {
  const gj = geojson(); let mx = 1; for (const f of gj.features) mx = Math.max(mx, f.properties.v);
  const col = COLOR[S.role];
  const label = S.met === 's'
    ? ['case', ['>=', ['get', 'v'], 1e9], ['concat', ['to-string', ['/', ['round', ['/', ['get', 'v'], 1e8]], 10]], ' mld'],
        ['>=', ['get', 'v'], 1e6], ['concat', ['to-string', ['/', ['round', ['/', ['get', 'v'], 1e5]], 10]], ' mil'],
        ['>=', ['get', 'v'], 1e3], ['concat', ['to-string', ['round', ['/', ['get', 'v'], 1e3]]], ' tis'], ['to-string', ['round', ['get', 'v']]]]
    : ['to-string', ['get', 'v']];
  const radius = ['interpolate', ['linear'], ['sqrt', ['get', 'v']], 0, 6, Math.sqrt(mx) * 0.12, 15, Math.sqrt(mx), 46];
  if (map.getSource('pl')) {
    map.getSource('pl').setData(gj);
    for (const id of ['cl', 'pt', 'sp']) { map.setPaintProperty(id, 'circle-color', col); map.setPaintProperty(id, 'circle-radius', radius); }
    unspider();
    map.setLayoutProperty('lbl', 'text-field', label);
    return;
  }
  map.addSource('pl', { type: 'geojson', data: gj, cluster: true, clusterRadius: 42, clusterMaxZoom: 17, clusterProperties: { v: ['+', ['get', 'v']] } });
  map.addSource('sel', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'sel', type: 'circle', source: 'sel', paint: { 'circle-radius': 22, 'circle-color': '#F5C518', 'circle-opacity': .45, 'circle-stroke-color': '#F5C518', 'circle-stroke-width': 3 } });
  map.addLayer({ id: 'cl', type: 'circle', source: 'pl', filter: ['has', 'point_count'], paint: { 'circle-color': col, 'circle-opacity': .6, 'circle-radius': radius, 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'pt', type: 'circle', source: 'pl', filter: ['!', ['has', 'point_count']], paint: { 'circle-color': col, 'circle-opacity': .78, 'circle-radius': radius, 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'lbl', type: 'symbol', source: 'pl', layout: { 'text-field': label, 'text-size': 12, 'text-font': ['Noto Sans Bold'], 'text-allow-overlap': false }, paint: { 'text-color': '#16213E', 'text-halo-color': '#fff', 'text-halo-width': 1.6 } });
  // rozbalené miesta s rovnakou polohou („pavúk“): čiary do stredu + krúžky s názvom
  map.addSource('spl', { type: 'geojson', data: EMPTY });
  map.addSource('spp', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'spl', type: 'line', source: 'spl', paint: { 'line-color': '#16213E', 'line-width': 1.6, 'line-opacity': .55 } });
  map.addLayer({ id: 'spc', type: 'circle', source: 'spl', filter: ['==', ['get', 'c'], 1], paint: { 'circle-radius': 6, 'circle-color': '#16213E', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'sp', type: 'circle', source: 'spp', paint: { 'circle-color': col, 'circle-opacity': .9, 'circle-radius': radius, 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'spt', type: 'symbol', source: 'spp', layout: { 'text-field': ['get', 't'], 'text-size': 12, 'text-font': ['Noto Sans Bold'], 'text-allow-overlap': true, 'text-anchor': 'top', 'text-offset': [0, 1.1] }, paint: { 'text-color': '#16213E', 'text-halo-color': '#fff', 'text-halo-width': 1.8 } });
  map.on('click', 'cl', async (e) => {
    if (map.queryRenderedFeatures(e.point, { layers: ['sp'] }).length) return; // klik patrí rozbalenému krúžku
    const f = e.features[0], src = map.getSource('pl'), id = f.properties.cluster_id;
    const leaves = await src.getClusterLeaves(id, 60, 0);
    const c0 = leaves[0].geometry.coordinates;
    const same = leaves.every((l) => Math.abs(l.geometry.coordinates[0] - c0[0]) < 2e-4 && Math.abs(l.geometry.coordinates[1] - c0[1]) < 2e-4);
    const z = await src.getClusterExpansionZoom(id);
    if (same || z > 16) spider(f.geometry.coordinates, leaves, id);
    else map.easeTo({ center: f.geometry.coordinates, zoom: z + 0.4, padding: pad() });
  });
  map.on('click', 'pt', (e) => { if (!map.queryRenderedFeatures(e.point, { layers: ['sp'] }).length) openPlace(e.features[0].properties.key); });
  map.on('click', 'sp', (e) => openPlace(e.features[0].properties.key));
  map.on('click', (e) => { if (spiderOn && !map.queryRenderedFeatures(e.point, { layers: ['sp', 'cl'] }).length) unspider(); });
  map.on('zoomstart', () => unspider());
  for (const id of ['cl', 'pt', 'sp']) { map.on('mouseenter', id, () => (map.getCanvas().style.cursor = 'pointer')); map.on('mouseleave', id, () => (map.getCanvas().style.cursor = '')); }
}
const EMPTY = { type: 'FeatureCollection', features: [] };
let spiderOn = false;
// Rozloží miesta z jedného bodu do kruhu okolo neho (v pixeloch, takže to vyzerá rovnako pri každom priblížení).
function spider(center, leaves, clusterId) {
  const n = leaves.length, c = map.project(center);
  const R = Math.max(70, Math.min(160, 22 * n)); // polomer v px
  leaves.sort((a, b) => b.properties.v - a.properties.v);
  const pts = [], lines = [{ type: 'Feature', geometry: { type: 'Point', coordinates: center }, properties: { c: 1 } }];
  leaves.forEach((l, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    const ll = map.unproject([c.x + R * Math.cos(ang), c.y + R * Math.sin(ang)]);
    const pos = [ll.lng, ll.lat], p = l.properties;
    const val = S.met === 's' ? short(p.v).replace(' €', '') : intf.format(p.v);
    pts.push({ type: 'Feature', geometry: { type: 'Point', coordinates: pos }, properties: { key: p.key, v: p.v, t: `${p.name}\n${val}` } });
    lines.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [center, pos] }, properties: {} });
  });
  map.getSource('spp').setData({ type: 'FeatureCollection', features: pts });
  map.getSource('spl').setData({ type: 'FeatureCollection', features: lines });
  // pôvodný spojený krúžok skryjeme, kým je rozbalený
  map.setFilter('cl', ['all', ['has', 'point_count'], ['!=', ['get', 'cluster_id'], clusterId]]);
  map.setFilter('lbl', ['!=', ['get', 'cluster_id'], clusterId]);
  spiderOn = true;
}
function unspider() {
  if (!spiderOn || !map.getSource('spp')) return;

  map.setFilter('cl', ['has', 'point_count']); map.setFilter('lbl', null);
  spiderOn = false;
}
function markSel(P) { if (map.getSource('sel')) map.getSource('sel').setData({ type: 'FeatureCollection', features: P ? [{ type: 'Feature', geometry: { type: 'Point', coordinates: [P.lon, P.lat] } }] : [] }); }

// ---------- spodný panel (mobil) ----------
const panel = $('#panel');
// polohy panela: 0 = len úchyt a názov miesta (veľká mapa), 1 = súhrn, 2 = polovica, 3 = celá obrazovka
const snaps = () => { const h = innerHeight; return [86, 344, Math.round(h * 0.6), h - 82]; };
let snap = 0;
const root = document.documentElement;
function setSnap(i) {
  snap = Math.max(0, Math.min(3, i));
  document.body.classList.toggle('sheet-full', snap === 3 && !desktop());
  document.body.classList.toggle('sheet-min', snap === 0 && !desktop());
  if (!desktop()) root.style.setProperty('--sh', snaps()[snap] + 'px'); else root.style.removeProperty('--sh');
}
(function dragSheet() {
  let y0 = 0, h0 = 0, moved = false, active = false;
  const start = (e) => { if (desktop()) return; document.querySelectorAll('#mapBtns,#beta').forEach((b) => (b.style.transition = 'none')); active = true; moved = false; y0 = e.clientY; h0 = panel.getBoundingClientRect().height; panel.classList.add('drag'); };
  const move = (e) => { if (!active) return; const dy = y0 - e.clientY; if (Math.abs(dy) > 4) moved = true; const s = snaps(); root.style.setProperty('--sh', Math.max(s[0] - 40, Math.min(s[2], h0 + dy)) + 'px'); };
  const end = (e) => {
    if (!active) return; active = false; panel.classList.remove('drag'); $('#mapBtns').style.transition = ''; $('#beta').style.transition = '';
    if (!moved) { setSnap(snap === 0 ? 1 : snap === 1 ? 2 : snap === 2 ? 3 : 1); return; }
    const h = panel.getBoundingClientRect().height, s = snaps(), v = y0 - e.clientY;
    let best = 0; s.forEach((x, i) => { if (Math.abs(x - h) < Math.abs(s[best] - h)) best = i; });
    if (Math.abs(v) > 60 && best === snap) best += v > 0 ? 1 : -1;
    setSnap(best);
  };
  for (const el of [$('#grab'), $('#head')]) el.addEventListener('pointerdown', (e) => { if (e.target.closest('button,a') || desktop()) return; // tlačidlá v hlavičke nesmú spúšťať ťahanie; na počítači sa neťahá
    el.setPointerCapture(e.pointerId); start(e); });

})();
addEventListener('resize', () => setSnap(snap));

// ---------- obsah panela ----------
function setTab(t) { S.tab = t; S.shown = 40; document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t)); render(); $('#body').scrollTop = 0;
  if (desktop()) { const t = $('#tabs').offsetTop; if (panel.scrollTop > t) panel.scrollTop = t; } }
$('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { setTab(b.dataset.t); if (snap <= 1) setSnap(2); } };

const TWIN = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="5.5" width="10" height="12" rx="2.2"/><path d="M7.5 5.5V4.7A2.2 2.2 0 0 1 9.7 2.5h5.6a2.2 2.2 0 0 1 2.2 2.2v7.6a2.2 2.2 0 0 1-2.2 2.2h-2.8"/></svg>';
function contractRow(f, r) {
  const o = Object.fromEntries(f.map((k, i) => [k, r[i]]));
  const amt = o.suma_spolu > 0 ? o.suma_spolu : o.suma;
  const dead = o.stav === 4 || o.stav === 5;
  // prečo sa suma nezapočítava do súčtov (staršie dáta pole nemajú → len zrušené)
  const why = o.nezapocitane !== undefined ? o.nezapocitane : dead ? 'zrušená' : null;
  const whyTag = why === 'dodatok' ? '<span class="tag">dodatok · nezapočítava sa</span>'
    : why === 'pravdepodobne chybná suma' || why === 'podozrivá suma' ? '<span class="tag red">pravdepodobne chybná suma · nezapočítava sa</span>'
    : why === 'duplicita' ? `<span class="tag twin">${TWIN}duplicita · nezapočítava sa</span>`
    : why ? `<span class="tag red">${STAV[o.stav] || why}</span>` : '';
  const dv = o.dvojica; // [id, číslo, pravidlo c/p, 1 = duplicita | 0 = započítaný originál]
  const twinTag = dv && !dv[3] && !why ? `<span class="tag twin">${TWIN}v registri 2×</span>` : '';
  const twinBox = !dv ? '' : `<div class="twinbox">${TWIN}<div>${dv[3]
    ? (dv[2] === 'c'
      ? 'Tá istá zmluva je v registri ešte raz – zverejnila ju aj druhá strana pod rovnakým číslom.'
      : `Pravdepodobne ide o tú istú zmluvu ako č. <b>${esc(dv[1] || '?')}</b>: rovnaké zmluvné strany, suma do centa aj dátum podpisu, líši sa len číslo. Zvyčajne ju zverejnila aj druhá strana pod svojím číslom.`)
      + ' Do súčtov ju rátame len raz.'
    : `${dv[2] === 'c' ? 'Tá istá zmluva' : 'Pravdepodobne tá istá zmluva'} je v registri aj pod číslom <b>${esc(dv[1] || '?')}</b> (zverejnila ju aj druhá strana). Do súčtov rátame len túto.`}
    <a href="https://www.crz.gov.sk/zmluva/${esc(dv[0])}/" target="_blank" rel="noopener">Otvoriť druhý záznam</a></div></div>`;
  const rows = f.filter((k) => LABEL[k] && o[k] != null && o[k] !== '').map((k) => {
    let v = o[k], html = null;
    if (k === 'suma' || k === 'suma_spolu') v = eur2.format(v);
    else if (k === 'stav') v = STAV[v] || v; else if (k === 'typ') v = TYP[v] || v; else if (k === 'druh') v = DRUH[v] || v; else if (k === 'zdroj') v = ZDROJ[v] || v;
    else if (k === 'obstaravanie' && /^https?:/.test(v)) html = `<a href="${esc(v)}" target="_blank" rel="noopener">otvoriť</a>`;
    else if (k.endsWith('_ico')) html = `${esc(v)} · <a href="https://www.finstat.sk/${esc(v)}" target="_blank" rel="noopener">FinStat</a> · <a href="https://www.orsr.sk/hladaj_ico.asp?ICO=${esc(v)}&SID=0" target="_blank" rel="noopener">ORSR</a>`;
    else if (/datum|zverejnene|zmenene|platnost/.test(k)) v = fdate(v) + (String(v).length > 10 ? ' ' + String(v).slice(11, 16) : '');

const col = (r, k) => (r ? r[S.cols.indexOf(k)] || 0 : 0);

function fieldIdx(f) { return { A: f.indexOf('suma_spolu'), B: f.indexOf('suma'), S: f.indexOf('stav'), X: f.indexOf('nezapocitane'), Z: f.indexOf('zverejnene'), O: f.indexOf('objednavatel'), D: f.indexOf('dodavatel') }; }
const amtOf = (I, r) => (r[I.A] > 0 ? r[I.A] : r[I.B]) || 0;

const rankRow = (attrs, name, sub, val, mx) => `<button class="rank" ${attrs}><div class="n"><b>${esc(name)}</b><small>${sub}</small><div class="bar" style="width:${Math.max(2, (val / mx) * 100)}%"></div></div><div class="amt">${short(val)}</div></button>`;

    const group = (k) => { const m = new Map(); for (const r of list) { const n = r[k] || '?'; const x = m.get(n) || [n, 0, 0]; x[1]++; x[2] += amtOf(I, r); m.set(n, x); } return [...m.values()].sort((a, b) => b[2] - a[2]); };
    const own = group(S.role === 'o' ? I.O : I.D), other = group(S.role === 'o' ? I.D : I.O);

const MES = ['jan', 'feb', 'mar', 'apr', 'máj', 'jún', 'júl', 'aug', 'sep', 'okt', 'nov', 'dec'];
// stĺpcový graf: keys = dni (RRRR-MM-DD) alebo mesiace (RRRR-MM)
function barChart(keys, vals, monthly) {
  const mx = Math.max(1, ...vals), W = 720, H = 240, bw = W / Math.max(1, keys.length);
  const bars = keys.map((k, i) => { const h = (vals[i] / mx) * (H - 34); const we = !monthly && [0, 6].includes(new Date(k).getDay());
    const lbl = monthly ? `${MES[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}` : fdate(k);
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - 22 - h).toFixed(1)}" width="${Math.max(1.5, bw - 2).toFixed(1)}" height="${Math.max(vals[i] ? 1.5 : 0, h).toFixed(1)}" rx="2" fill="${we ? '#C9D1E2' : COLOR[S.role]}"><title>${lbl}: ${S.met === 's' ? eur.format(vals[i]) : vals[i] + ' zmlúv'}</title></rect>`; }).join('');
  const every = monthly ? (keys.length > 14 ? 3 : 1) : 0;
  const ticks = keys.map((k, i) => (monthly ? i % every === 0 : k.endsWith('-01') || (keys.length <= 31 && i % 7 === 0))
    ? `<text x="${(i * bw + (monthly ? bw / 2 : 0)).toFixed(1)}" y="${H - 4}" font-size="13" fill="#5D6680" font-family="Bricolage Grotesque"${monthly ? ' text-anchor="middle"' : ''}>${monthly ? MES[+k.slice(5, 7) - 1] : k.endsWith('-01') ? MES[+k.slice(5, 7) - 1] : +k.slice(8)}</text>` : '').join('');
  const tot = vals.reduce((a, b) => a + b, 0), top = Math.max(0, ...vals);
  return `<div class="kpis"><div><small>Spolu</small><b class="num">${S.met === 's' ? short(tot) : intf.format(tot)}</b></div><div><small>Najsilnejší ${monthly ? 'mesiac' : 'deň'}</small><b class="num">${S.met === 's' ? short(top) : intf.format(top)}</b></div></div>
    <div id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj zmlúv">${bars}${ticks}</svg></div>`;
}
function dayKeys(from) { const out = []; const d = new Date(from + 'T00:00:00Z'), end = new Date(); while (d < end) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } return out; }
function renderChart() {
  const monthly = S.per === 'all' || S.per === 'ever';
  const from = S.per === 'ever' ? (S.meta.everFrom || S.meta.windowStart) : S.meta.periods[S.per];
  const by = new Map();
  let note;
  if (S.place) {
    const f = S.place.fields, I = fieldIdx(f);
    for (const r of placeList()) { if (skipOf(I, r)) continue; const z = (r[I.Z] || '').slice(0, monthly ? 7 : 10); if (!z) continue; const x = by.get(z) || { n: 0, s: 0 }; x.n++; x.s += amtOf(I, r); by.set(z, x); }
    note = `Hodnota zmlúv ${S.role === 'o' ? 'objednávateľov' : 'dodávateľov'} so sídlom v mieste ${esc(S.place.name)} podľa dátumu zverejnenia${S.per === 'ever' ? ' (za ' + winName() + ')' : ''}.`;
  } else {
    if (!S.daily) { api('daily.json').then((d) => { S.daily = d; render(); }); return '<p class="empty">Načítavam…</p>'; }
    for (const [d, v0] of Object.entries(S.daily)) { if (d < from) continue; const v = S.priv ? { n: v0.np || 0, s: v0.sp || 0 } : v0; const k = monthly ? d.slice(0, 7) : d; const x = by.get(k) || { n: 0, s: 0 }; x.n += v.n; x.s += v.s; by.set(k, x); }
    note = `Hodnota ${S.priv ? 'zmlúv so súkromným sektorom' : 'všetkých zmlúv'} na Slovensku podľa dátumu zverejnenia.${monthly ? '' : ' Sivé sú víkendy.'}`;
  }
  let keys = monthly ? [...new Set(dayKeys(from).map((d) => d.slice(0, 7)))] : dayKeys(from);
  const vals = keys.map((k) => (by.get(k) || { n: 0, s: 0 })[S.met]);
  return `<p class="lead">${note}</p>${barChart(keys, vals, monthly)}`;
}

  <ul>${m.sources.map((s) => `<li><a href="${s.url}" target="_blank">${esc(s.name)}</a>, licencia ${esc(s.license)}</li>`).join('')}<li>Mapa © <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> a prispievatelia OpenStreetMap</li>
  <li>Zdrojový kód: <a href="https://github.com/jandokan/vydavky-statu" target="_blank">GitHub</a></li></ul>
  <h3>Prevádzkovateľ a kontakt</h3>
  <p>Mapa verejných zmlúv, Ján Koterba${CONTACT ? `, <a href="mailto:${CONTACT}">${CONTACT}</a>` : ''}. ${CONTACT ? 'Našiel si chybu alebo je subjekt zle zaradený? Napíš, opravíme to.' : ''}</p>
  <a class="btn sec" href="/ochrana-udajov.html">Ochrana osobných údajov</a>
  <p class="lead">Aktualizované ${new Date(m.generated).toLocaleString('sk-SK')}</p></div>`;
}

const PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const SKICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
function renderHead() {
  if (!S.cols) return;
  const n = `${S.role}${S.per}n${SFX()}`, sm = `${S.role}${S.per}s${SFX()}`;
  let sum = 0, cnt = 0, places = 0, mapped = 0;
  if (S.place) { const r = placeRow(S.place.key); sum = col(r, sm); cnt = col(r, n); }
  else {
    const iN = S.cols.indexOf(n), iS = S.cols.indexOf(sm);
    for (const r of S.places) { mapped += r[iS]; cnt += r[iN]; if (r[iN]) places++; }
    // celé Slovensko: súčet všetkých zmlúv, rovnaký pre obe strany (aj tie, ktoré sa nedajú umiestniť na mapu)
    const t = S.meta.totals && S.meta.totals[S.per + SFX()];
    if (t) { sum = t.s; cnt = t.n; } else sum = mapped;
  }
  $('#scope').innerHTML = S.place
    ? `<span class="lbl here">${PIN}<span>${esc(S.place.name)}<small>${esc(where(S.place))}</small></span></span><button class="back" id="toSK">${SKICON}Celé Slovensko</button>`
    : `<span class="lbl">${SKICON}<span>Celé Slovensko<small>ťukni na krúžok a vyber miesto</small></span></span>`;
  $('#tSum').textContent = short(sum); $('#tCnt').textContent = intf.format(cnt);
  const side = S.role === 'o' ? 'objednávateľa' : 'dodávateľa';
  const off = sum - mapped;
  $('#tSub').innerHTML = (S.place
    ? `hodnota ${S.priv ? 'zmlúv so súkromným sektorom' : 'zmlúv'} ${perName()}, kde ${S.role === 'o' ? 'objednávateľ' : 'dodávateľ'} sídli tu`
    : `hodnota ${S.priv ? 'zmlúv so súkromným sektorom' : 'všetkých zmlúv'} ${perName()}<span class="src">na mape podľa sídla ${side}: ${short(mapped)} v ${intf.format(places)} miestach${off > sum * 0.02 ? `, ${short(off)} bez adresy na Slovensku` : ''}</span>`)
    + `
<span class="src">Zdroj: CRZ (CC BY 4.0, upravené) · aktualizované ${new Date(S.meta.generated).toLocaleString('sk-SK', { day: 'numeric', month: 'numeric', hour: 'numeric', minute: '2-digit' })} · <button class="how" id="how">Ako počítame?</button></span>`;
}
$('#scope').addEventListener('click', (e) => { if (e.target.closest('#toSK')) resetScope(); });
$('#tSub').addEventListener('click', (e) => { if (e.target.closest('#how')) { setTab('about'); if (snap < 3) setSnap(3); setTimeout(() => $('#ako')?.scrollIntoView({ block: 'start' }), 60); } });
function render() {
  renderHead();
  $('#body').innerHTML = { list: renderList, ents: renderEnts, chart: renderChart, about: renderAbout }[S.tab]();
  if ($('#susp')) (S.susp ? Promise.resolve(S.susp) : api('suspicious.json').then((x) => (S.susp = x))).then((x) => { const el = $('#susp'); if (el) el.innerHTML = x.rows.map((r) => contractRow(x.fields, r)).join(''); }).catch(() => {});
}

async function openPlace(key, filter = '') {
  if (S.tab === 'about') S.tab = 'list';
  if (snap <= 1) setSnap(2);
  $('#body').innerHTML = '<p class="empty">Načítavam…</p>';
  try {
    S.place = await api('p/' + encodeURIComponent(key) + '.json');
    S.filter = filter || ''; S.shown = 40; S.sort = 'amt';
    markSel(S.place);
    map.easeTo({ center: [S.place.lon, S.place.lat], zoom: Math.max(map.getZoom(), 9), padding: { ...pad(), bottom: desktop() ? 40 : innerHeight * 0.55 + 20 }, duration: 600 });
    setTab(S.tab);
  } catch (e) { $('#body').innerHTML = `<p class="empty">Miesto sa nepodarilo načítať (${esc(e.message)}). Skús to znova.</p>`; }
}
function resetScope() {
  S.place = null; S.filter = ''; S.shown = 40; markSel(null); home(); setTab(S.tab);
}

// ---------- ovládanie ----------
function setRole(v) { S.role = v; document.body.classList.toggle('role-d', v === 'd'); $('#role').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.v === v)); if (S.cols) drawMap(); }
$('#role').onclick = (e) => { const b = e.target.closest('button'); if (b) { setRole(b.dataset.v); S.shown = 40; render(); } };
$('#per').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) { S.per = b.dataset.v; $('#per').querySelectorAll('[data-v]').forEach((x) => x.classList.toggle('on', x === b)); }
  if (b.dataset.m) { S.met = b.dataset.m; $('#per').querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); }
  S.shown = 40; drawMap(); render();
};
$('#priv').onclick = () => {
  S.priv = !S.priv; S.shown = 40;
  $('#priv').classList.toggle('on', S.priv); $('#priv').setAttribute('aria-pressed', S.priv);
  drawMap(); render();
};
/* ---------- počítadlo návštevnosti (worker/live.js) ---------- */
(() => {
  const el = $('#live');
  const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch { return null; } };
  let sid = ss('mvz-s');
  if (!sid) { sid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); ss('mvz-s', sid); }
  const pl = (n, one, few, many) => (n === 1 ? one : n >= 2 && n <= 4 ? few : many);
  let timer = 0, last = 0, every = 120;
  async function ping() {
    clearTimeout(timer);
    last = Date.now();
    const isNew = !ss('mvz-n');
    try {
      const r = await fetch(`/live?s=${sid}${isNew ? '&n=1' : ''}`, { cache: 'no-store' });
      if (!r.ok) throw 0;
      const x = await r.json();
      if (isNew) ss('mvz-n', '1');
      every = x.every;
      el.innerHTML = `<span class="now"><span class="dot"></span><span><b>${intf.format(x.now)}</b> práve tu</span></span>`
        + `<span><b>${intf.format(x.day)}</b> ${pl(x.day, 'návšteva', 'návštevy', 'návštev')} za deň</span>`
        + `<span><b>${intf.format(x.month)}</b> za mesiac</span>`;
      el.hidden = false;
    } catch { if (!el.innerHTML) el.hidden = true; }
    if (every > 0 && !document.hidden) timer = setTimeout(ping, every * 1000);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else if (every > 0 && Date.now() - last > 60000) ping();
    else if (every > 0) timer = setTimeout(ping, every * 1000);
  });
  ping();
})();
$('#beta').onclick = () => { if (document.body.classList.contains('fs')) $('#btnFs').click(); setTab('about'); if (!desktop() && snap < 3) setSnap(3); if (document.body.classList.contains('panel-off')) $('#panelToggle').click(); setTimeout(() => $('#test')?.scrollIntoView({ block: 'start' }), 60); };
$('#panelToggle').onclick = () => {
  const off = document.body.classList.toggle('panel-off');
  $('#panelToggle').setAttribute('aria-label', off ? 'Zobraziť panel' : 'Skryť panel');
  setTimeout(() => map.resize(), 280);
};
$('#btnHome').onclick = () => (S.place ? resetScope() : home());
$('#btnFs').onclick = async () => {
  const on = !document.body.classList.contains('fs');
  document.body.classList.toggle('fs', on);
  try { if (on && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) await document.exitFullscreen(); } catch {}
  $('#btnFs').setAttribute('aria-label', on ? 'Ukončiť celú obrazovku' : 'Celá obrazovka');
  setTimeout(() => map.resize(), 250);
};
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) { document.body.classList.remove('fs'); setTimeout(() => map.resize(), 250); } });

// vyhľadávanie
const q = $('#q'), res = $('#res');
function openSearch() { $('#search').classList.add('on'); loadNames(); setTimeout(() => q.focus(), 50); }
function closeSearch() { $('#search').classList.remove('on'); q.blur(); }
$('#btnSearch').onclick = openSearch; $('#btnSearch2').onclick = openSearch; $('#qClose').onclick = closeSearch;
$('#search').onclick = (e) => { if (e.target.id === 'search') closeSearch(); };
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); openSearch(); } });
q.addEventListener('input', async () => {
  const t = norm(q.value.trim());
  if (t.length < 2) { res.innerHTML = '<p class="lead">Napíš aspoň dve písmená.</p>'; return; }
  const N = await loadNames(); const out = [];
  for (const role of ['o', 'd']) N[role].forEach((e, i) => { if (out.length < 60 && (norm(e[0]).includes(t) || (e[1] && e[1].includes(t)))) out.push([role, i, e]); });
  out.sort((a, b) => b[2][4] - a[2][4]);
  res.innerHTML = out.slice(0, 25).map(([role, i, e]) => `<button class="rank" data-ent="${role}:${i}"><div class="n"><b>${esc(e[0])}</b><small><span class="tag ${role === 'o' ? '' : 'acc'}" style="${role === 'o' ? 'background:#E6EBFF;color:#2747E6' : 'background:#FCE4EE;color:#D21F66'}">${role === 'o' ? 'objednávateľ' : 'dodávateľ'}</span> ${intf.format(e[3])} ${plural(e[3], 'zmluva', 'zmluvy', 'zmlúv')}${e[2] ? '' : ', bez miesta na mape'}</small></div><div class="amt">${short(e[4])}</div></button>`).join('')
    || '<p class="empty">Nič sa nenašlo. Hľadáme medzi subjektmi so zmluvami za posledné obdobie.</p>';
});
res.addEventListener('click', (e) => { const b = e.target.closest('[data-ent]'); if (b) { const [role, i] = b.dataset.ent.split(':'); goEnt(role, +i); } });

// ---------- štart ----------
setSnap(1);
(async () => {
  try {
    S.meta = await api('meta.json'); V = S.meta.generated;
    $('#perAll').textContent = S.meta.windowDays >= 365 ? '1 rok' : S.meta.windowDays + ' dní';
    const pl = await api('places.json'); S.cols = pl.cols; S.places = pl.rows; S.pidx = new Map(pl.rows.map((r) => [r[0], r]));
    if (!S.cols.includes('oevern')) document.querySelector('#per [data-v=ever]').hidden = true;
    if (!S.cols.includes('o7n_p')) $('#priv').hidden = true; // staršie dáta bez súhrnov
    if (map.loaded()) drawMap(); else map.on('load', drawMap);
    render();
  } catch (e) {
    $('#tSub').textContent = 'Dáta sa nepodarilo načítať.';
    $('#body').innerHTML = `<p class="empty">Dáta sa nepodarilo načítať. Skontroluj pripojenie a obnov stránku.<br><small>${esc(e.message)}</small></p>`;
  }
})();
</script>
