name: Nasadenie na Cloudflare

# Po zmene stránky alebo Workera nasadí novú verziu s aktuálnymi dátami.
# (Denné dáta nasadzuje update.yml sám po každom stiahnutí.)
on:
  push:
    branches: [main]
    paths: ['public/**', 'worker/**', 'wrangler.jsonc', 'scripts/build-site.sh', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Načítať dáta (vetva data)
        run: |
          mkdir -p data
          git fetch --depth=1 origin data && git --work-tree=data checkout FETCH_HEAD -- api && git reset -q || echo "Vetva data zatiaľ neexistuje"
      - name: Poskladať stránku
        run: CONTACT_EMAIL="${{ vars.CONTACT_EMAIL }}" bash scripts/build-site.sh
      - name: Nasadiť
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Chýba secret CLOUDFLARE_API_TOKEN – nasadenie preskočené (pozri README)."; exit 0; fi
          npx -y wrangler@4 deploy
